
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Homepage Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="left-links">
                <a href="https://about.google/">About</a>
                <a href="https://store.google.com/">Store</a>
            </div>

            <div class="right-links">
                <a href="https://mail.google.com/">Gmail</a>
                <a href="https://images.google.com/">Images</a>
                <button class="sign-in">Sign in</button>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </h1>

        <form action="https://www.google.com/search" method="get">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" name="q" aria-label="Search Google">
                <span class="mic-icon">🎙</span>
            </div>

            <div class="buttons">
                <button type="submit">Google Search</button>
                <button type="button" onclick="window.location.href='https://doodles.google/'">I'm Feeling Lucky</button>
            </div>
        </form>

        <p class="language">
            Google offered in:
            <a href="https://www.google.com/">English</a>
            <a href="https://www.google.com/?hl=kn">ಕನ್ನಡ</a>
        </p>
    </main>

    <footer>
        <div class="country">India</div>
        <div class="footer-links">
            <div>
                <a href="https://ads.google.com/">Advertising</a>
                <a href="https://business.google.com/">Business</a>
                <a href="https://www.google.com/search/howsearchworks/">How Search works</a>
            </div>
            <div>
                <a href="https://policies.google.com/privacy">Privacy</a>
                <a href="https://policies.google.com/terms">Terms</a>
                <a href="https://www.google.com/">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
